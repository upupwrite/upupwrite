# cava 配置：专供 waybar 的 custom/cava 模块使用
# 输出原始 ascii 数据到 stdout，由 scripts/cava.sh 转成方块字符

[general]
# 频谱柱子数量（配合 style.css 里的字号，约 90~110px 宽）
bars = 12
framerate = 60
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
# 单声道：12 根柱子覆盖完整频段，不做左右对称
channels = mono

[smoothing]
noise_reduction = 50
